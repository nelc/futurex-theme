name: Run tests

on:
  pull_request:
    branches: [ release, main, open-release/teak.nelp ]
  push:
    branches: [ release, main ]

jobs:
  tests:
    # The package cannot be installed on open-release/teak.nelp (pyproject.toml
    # points at a .hatch_build.py that is not in that branch), so the static
    # checks keep their original scope.
    if: github.base_ref != 'open-release/teak.nelp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python 3.9
        uses: actions/setup-python@v2
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          pip install .[dev]
      - name: Test lint, types, and format
        run: make test

  template-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test homepage template rendering
        run: |
          pip install mako
          python -m unittest discover -s tests -v
