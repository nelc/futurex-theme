{# Program / course name in its own box. Usage: {% include "ace_common/edx_ace/common/fx_program_box.html" with fx_program_name=course_name %} #}
<table role="presentation" dir="{{ fx_dir }}" align="center" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 0 0;">
  <tr>
    <td dir="{{ fx_dir }}" align="center" bgcolor="#eef7f2" style="padding:14px 18px;background-color:#eef7f2;border:1px solid #1B8354;border-radius:8px;text-align:center;font-size:18px;line-height:28px;font-weight:700;color:#1B8354;word-wrap:break-word;overflow-wrap:anywhere;word-break:break-word;">
      {{ fx_program_name }}
    </td>
  </tr>
</table>
